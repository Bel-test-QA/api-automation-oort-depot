apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrastructure-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservices-infra
  template:
    metadata:
      labels:
        app: microservices-infra
    spec:
      containers:
      # 1. Сервер баз данных логов (Elasticsearch)
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
        ports:
        - containerPort: 9200
        env:
        - name: discovery.type
          value: "single-node"
        - name: ES_JAVA_OPTS
          value: "-Xms512m -Xmx512m"

      # 2. Веб-интерфейс логов (Kibana)
      - name: kibana
        image: docker.elastic.co/kibana/kibana:7.17.10
        ports:
        - containerPort: 5601
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://localhost:9200"

      # 3. Служебный менеджер Кафки (Zookeeper)
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.3.0
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"

      # 4. Сама Очередь Сообщений (Apache Kafka)
      - name: kafka
        image: confluentinc/cp-kafka:7.3.0
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "localhost:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://localhost:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: kibana-service
spec:
  type: NodePort
  selector:
    app: microservices-infra
  ports:
  - port: 5601
    targetPort: 5601
    nodePort: 30001
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
spec:
  selector:
    app: microservices-infra
  ports:
  - port: 9200
    targetPort: 9200



